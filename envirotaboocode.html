<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnviroTaboo: Environmental Science</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eef6ee;
  text-align: center;
  margin: 0;
  padding: 0;
}
#game-container {
  margin: 2em auto;
  max-width: 700px;
  background: #fff;
  border-radius: 8px;
  padding: 2em;
  box-shadow: 0 4px 14px rgba(0,0,0,0.15);
}
h1 { color:#00773a;margin-bottom:1em;}
button {
  margin:.5em;
  padding:.7em 1.3em;
  font-size:1em;
  border:none;
  border-radius:6px;
  background:#00773a;
  color:white;
  cursor:pointer;
}
button:hover{background:#009b4a;}
.hidden{display:none;}
.stats{display:flex;justify-content:space-around;font-weight:bold;margin-bottom:.5em;}
textarea{
  width:90%;
  height:4.5em;
  resize:none;
  font-size:1em;
  padding:.5em;
  border-radius:4px;
  border:1px solid #ccc;
}
#taboo-words{color:red;font-weight:600;margin-top:.5em;}
#feedback{min-height:1.5em;margin-top:.5em;}
.controls{margin-top:1.2em;}
</style>
</head>
<body>
<div id="game-container">
<h1>🌍 EnviroTaboo: Environmental Science</h1>

<div id="menu">
  <button id="mode1">You Give Clues ➜ Computer Guesses</button>
  <button id="mode2">Computer Gives Clues ➜ You Guess</button>
</div>

<div id="play-area" class="hidden">
  <div class="stats">
    <div id="timer">⏱ 300</div>
    <div id="score">Score: 0</div>
  </div>
  <h2 id="prompt"></h2>
  <div id="taboo-words"></div>

  <textarea id="playerInput" placeholder="Type your clue or guess..."></textarea><br>
  <button id="submitBtn">Enter</button>

  <div id="feedback"></div>
  <div class="controls">
    <button id="nextBtn">Next Card ➜</button>
    <button id="quitBtn">Quit</button>
  </div>
</div>
</div>

<script>
const bank=[
{term:"Abiotic",taboo:["living","biotic","nonliving","organism","life"]},
{term:"Biotic",taboo:["living","abiotic","organism","alive","life"]},
{term:"Ecosystem services",taboo:["ecosystem","benefit","nature","provide","service"]},
{term:"Natural resources",taboo:["nature","resource","material","earth","supply"]},
{term:"Hypothesis",taboo:["prediction","test","experiment","guess","theory"]},
{term:"Dependent variable",taboo:["independent","variable","measure","change","result"]},
{term:"Independent variable",taboo:["dependent","variable","control","manipulate","change"]},
{term:"Isotope",taboo:["neutron","atom","carbon","element","mass"]},
{term:"Covalent bond",taboo:["bond","ionic","electron","share","hydrogen"]},
{term:"Hydrogen bond",taboo:["covalent","bond","water","H","hydrogen"]},
{term:"Electronegativity",taboo:["electron","charge","polar","atom","attract"]},
{term:"Polar molecule",taboo:["charge","water","polar","partial","nonpolar"]},
{term:"Carbon cycle",taboo:["carbon","respiration","photosynthesis","fossil fuel","decomposition"]},
{term:"Nitrogen fixation",taboo:["nitrogen","bacteria","atmosphere","fix","convert"]},
{term:"Denitrification",taboo:["nitrogen","bacteria","gas","soil","cycle"]},
{term:"Net primary productivity",taboo:["NPP","photosynthesis","respiration","GPP","carbon"]},
{term:"Specific heat capacity",taboo:["heat","water","temperature","absorb","capacity"]},
{term:"Erosion",taboo:["weathering","soil","rock","water","wind"]},
{term:"Osmosis",taboo:["water","diffusion","membrane","concentration","semipermeable"]},
{term:"Photosynthesis",taboo:["chlorophyll","sun","glucose","plant","carbon dioxide"]},
{term:"Cell membrane",taboo:["water","diffusion","membrane","phosphorylation","barrier","bilayer"]},
{term:"Cellular respiration",taboo:["ATP","oxygen","mitochondria","energy","glucose"]},
{term:"Metabolism",taboo:["energy","anabolic","catabolic","rate","chemical"]},
{term:"Autotroph",taboo:["producer","plant","photosynthesis","self","heterotroph"]},
{term:"Chemosynthesis",taboo:["chemical","energy"]},
{term:"Abiogenesis",taboo:["life","origin","spontaneous","nonliving","chemical"]},
{term:"Natural selection",taboo:["evolution","survival","fitness","adapt","Darwin"]},
{term:"Genetic drift",taboo:["random","evolution","allele","population","selection"]},
{term:"Speciation",taboo:["species","new","isolation","reproductive","evolve"]},
{term:"Gene flow",taboo:["migration","allele","population","genes","movement"]},
{term:"Trophic cascade",taboo:["keystone","predator","food web","top-down","trophic"]},
{term:"Competitive exclusion",taboo:["competition","niche","resource","exclude","species"]},
{term:"Mutualism",taboo:["symbiosis","benefit","both","relationship","together"]},
{term:"Primary succession",taboo:["primary","secondary","pioneer","community","rock"]},
{term:"Fundamental niche",taboo:["niche","potential","actual","resource","competition"]},
{term:"Intraspecific competition",taboo:["same","species","resource","population","density"]},
{term:"Atmospheric convection cell",taboo:["convection","air","hot","rise","Hadley"]},
{term:"Thermohaline circulation",taboo:["ocean","current","density","salt","deep"]},
{term:"Upwelling",taboo:["ocean","nutrient","cold","surface","current"]},
{term:"El Nino",taboo:["Pacific","warm","weather","La Nina","ENSO"]},
{term:"Coriolis effect",taboo:["rotation","earth","deflect","wind","current"]},
{term:"Subduction zone",taboo:["plate","convergent","ocean","trench","crust"]},
{term:"Seafloor spreading",taboo:["divergent","mid-ocean ridge","magma","new crust","plate"]},
{term:"Sedimentary rock",taboo:["sedimentary","rock","layer","fossil","deposit"]},
{term:"Transform boundary",taboo:["fault","slide","earthquake","plate","horizontal"]},
{term:"Seismic waves",taboo:["earthquake","wave","primary","secondary","shake"]}
];
// reused repeat of some missing count filler for 69 (extend duplicates minor variants)
while(bank.length<69){
  bank.push({...bank[bank.length%45]});
}

let current=null,mode=null,score=0,timer=300,tick=null,guessCount=0;
const pEl=document.getElementById("prompt"),
      tEl=document.getElementById("taboo-words"),
      inEl=document.getElementById("playerInput"),
      fEl=document.getElementById("feedback"),
      nextB=document.getElementById("nextBtn"),
      quitB=document.getElementById("quitBtn"),
      timeEl=document.getElementById("timer"),
      scEl=document.getElementById("score"),
      play=document.getElementById("play-area");
document.getElementById("mode1").onclick=()=>start("mode1");
document.getElementById("mode2").onclick=()=>start("mode2");
document.getElementById("submitBtn").onclick=handleInput;
nextB.onclick=nextCard;
quitB.onclick=resetGame;

function start(m){
  mode=m;
  document.getElementById("menu").classList.add("hidden");
  play.classList.remove("hidden");
  score=0;scEl.textContent="Score: "+score;
  startTimer();
  nextCard();
}

function startTimer(){
  clearInterval(tick);
  timer=300;
  timeEl.textContent="⏱ "+timer;
  tick=setInterval(()=>{
    timer--;
    timeEl.textContent="⏱ "+timer;
    if(timer<=0){
      clearInterval(tick);
      fEl.textContent="⏰ Time's up!";
      inEl.disabled=true;
    }
  },1000);
}

function nextCard(){
  inEl.disabled=false;
  inEl.value="";
  fEl.textContent="";
  guessCount=0;
  current=bank[Math.floor(Math.random()*bank.length)];
  if(mode==="mode1"){
    pEl.textContent=`Give clues for: ${current.term}`;
    tEl.textContent="TABOO: "+current.taboo.join(", ");
  }else{
    const hints=["Science concept","Environment process","Ecosystem topic","Earth system term"];
    pEl.textContent=`Hint: ${hints[Math.floor(Math.random()*hints.length)]}`;
    tEl.textContent="(guess the term)";
  }
}

function handleInput(){
  const txt=inEl.value.trim().toLowerCase();
  if(!txt)return;
  if(mode==="mode1"){
    guessCount++;
    const key=current.term.toLowerCase().split(" ")[0];
    // first guess intentionally wrong but related
    if(guessCount===1){
      fEl.textContent=`🤖 Computer: Maybe it's '${relatedGuess(current.term)}'? 🤔`;
      return;
    }
    let chance=0.2+0.15*guessCount;
    if(txt.includes(key)) chance=1;
    if(Math.random()<chance){
      fEl.textContent="🤖 Computer guessed it! ✅";
      score++;scEl.textContent="Score: "+score;
      inEl.disabled=true;
      setTimeout(()=>nextCard(),1500);
    }else{
      const misses=["🤖 Hmm... still pondering...","🤖 Not quite yet.","🤖 Sounds close!","🤖 Maybe another clue?"];
      fEl.textContent=misses[Math.floor(Math.random()*misses.length)];
    }
  }else{
    if(txt===current.term.toLowerCase()){
      fEl.textContent="Correct! ✅";
      score++;scEl.textContent="Score: "+score;
      inEl.disabled=true;
      setTimeout(()=>nextCard(),1500);
    }else{
      fEl.textContent="Try again ❌";
    }
  }
}

function relatedGuess(term){
  const pool=["Photosynthesis","Nitrogen fixation","Hydrogen bond","Carbon cycle","Mutation","Erosion","Upwelling","Atmospheric convection cell","Osmosis","Biotic","Abiotic","Natural selection"];
  let diff=pool[Math.floor(Math.random()*pool.length)];
  if(diff.toLowerCase()===term.toLowerCase()) diff="Eutrophication";
  return diff;
}
function resetGame(){
  clearInterval(tick);
  play.classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");
}
</script>
</body>
</html>
